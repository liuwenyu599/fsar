# ======================================================================
# ✔️ Compatible Config for train.py
# ======================================================================
# --- PAG-FSL 系统配置 ---
system:
  common_dim: 512              # 公共特征维度 D
  num_covariates: 4            # 协变量类别数 (例如 4 种衣着)
  device: "cuda"               # 或 "cuda:0", "cuda:1", "cpu"
# --- Few-Shot 任务配置 ---
few_shot:
  n_way: 5                     # N-way
  k_shot: 5                    # K-shot
  q_query: 15                  # Q-query
  batch_size: 64
# --- 损失函数权重 ---
weights:
  lambda_disc: 0.001            # L_disc 权重
  lambda_align: 0.5            # L_align 权重

# --- 训练参数 ---
train:
  lr: 0.0001
  epochs: 100
  batch_size_per_episode: 4    # 仅占位，实际由 Sampler 控制

# --- 数据集路径 ---
datasets:
  casia_b_root: /datasets/CASIA-B